[Settings]
# The glycin/gdk-pixbuf SVG loader runs in a bwrap sandbox that binds only /usr,
# so icon themes under ~/.local/share/icons (e.g. BeautyBeam) cannot be read and
# GTK aborts with "Loader process exited early". Use a system-wide theme.
gtk-icon-theme-name=Adwaita
gtk-theme-name=Adwaita
gtk-application-prefer-dark-theme=true
gtk-font-name=Sans 10
